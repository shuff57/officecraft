[package]
name = "officecraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "One tabbed window for WordCraft, GridCraft, DeckCraft and PdfCraft"

[dependencies]
wordcraft-doc = { path = "../wordcraft/crates/doc" }
wordcraft-engine = { path = "../wordcraft/crates/engine" }
wordcraft-ui-egui = { path = "../wordcraft/crates/ui-egui" }
gridcraft-engine = { path = "../gridcraft/crates/engine" }
gridcraft-ui-egui = { path = "../gridcraft/crates/ui-egui" }
deckcraft-engine = { path = "../deckcraft/crates/engine" }
deckcraft-ui-egui = { path = "../deckcraft/crates/ui-egui" }
pdfcraft-ui-egui = { path = "../pdfcraft/crates/ui-egui" }
# viSHual: the graphing engine (JSON command API, headless GPU renderer) behind the Graph tab.
math_playground = { path = "../abstract-math-playground/math_playground" }
math_core = { path = "../abstract-math-playground/math_core" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"
log = "0.4"
serde_json = "1"
ureq = "3"

# pdfcraft builds against vendored forks; cargo ignores [patch] from path dependencies, so the
# suite shell repeats them or pdfcraft-render sees stock hayro and fails to compile.
[patch.crates-io]
hayro-interpret = { path = "../pdfcraft/vendor/hayro-interpret" }
hayro = { path = "../pdfcraft/vendor/hayro" }
hayro-syntax = { path = "../pdfcraft/vendor/hayro-syntax" }
hayro-jbig2 = { path = "../pdfcraft/vendor/hayro-jbig2" }
lopdf = { path = "../pdfcraft/vendor/lopdf" }
winit = { path = "../pdfcraft/vendor/winit" }
egui-wgpu = { path = "../pdfcraft/vendor/egui-wgpu" }
