    <!-- Sheets: bottom left, green -->
    <g transform="translate(91 271)">
      <g>
        <rect width="150" height="150" rx="36" fill="#1f9d55"/>
        <g fill="#fff">
          <rect x="32" y="34" width="26" height="22" rx="5"/>
          <rect x="64" y="34" width="26" height="22" rx="5"/>
          <rect x="96" y="34" width="26" height="22" rx="5"/>
