      <g>
        <rect width="150" height="150" rx="36" fill="#f07a1e"/>
        <g fill="#fff">
          <rect  x="34" y="28" width="50" height="9" rx="4.5"/>
          <rect x="34" y="76" width="26" height="36" rx="6" opacity=".85"/>
          <rect  x="62" y="50" width="26" height="62" rx="6"/>
