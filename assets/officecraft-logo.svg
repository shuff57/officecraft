<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OfficeCraft">
  <title>OfficeCraft</title>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#2d4f6e"/>

  <g>
