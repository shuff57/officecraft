      <g>
        <rect width="150" height="150" rx="36" fill="#3f5fe0"/>
        <g fill="#fff">
          <rect  x="32" y="34" width="86" height="10" rx="5"/>
          <rect   x="32" y="56" width="62" height="10" rx="5" opacity=".85"/>
