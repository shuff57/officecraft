<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Send a question or a note to the maker of OfficeCraft.">
  <title>Contact - OfficeCraft</title>
  <style>
    /* Home's look (src/main.rs): cool-grey page, white panels, one teal accent */
    :root { --page: #edf1f5; --panel: #fff; --line: #dce2ea; --field: #8c96a3; --ink: #17202b; --soft: #45515f;
      --accent: #0b7a75; --accent-hover: #096460; --error: #b42318; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { min-height: 100vh; background: var(--page); color: var(--ink);
      font: 15px/1.55 Ubuntu, system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 16px;
      background: var(--panel); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-size: 17px; font-weight: 700; }
    .brand svg { width: 30px; height: 30px; flex: none; }
    .back { margin-left: auto; color: var(--accent); font-weight: 700; text-decoration: none; padding: 8px 4px; }
    .back:hover { color: var(--accent-hover); text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    main { width: 100%; max-width: 40rem; margin: 0 auto; padding: 36px 16px 64px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
    h1 { margin: 0 0 6px; font-size: 24px; font-weight: 500; }
    .lede { margin: 0 0 22px; color: var(--soft); }
    .contact { --lhd-cf-accent: var(--accent); --lhd-cf-field-bg: #fff; --lhd-cf-border: 1px solid var(--field);
      --lhd-cf-radius: 10px; --lhd-cf-btn-bg: var(--accent); --lhd-cf-btn-fg: #fff; --lhd-cf-error: var(--error);
      --lhd-cf-max: none; }
    @media (max-width: 480px) { main { padding-top: 20px; } .card { padding: 18px; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="./">
      <svg viewBox="0 0 512 512" aria-hidden="true"><rect x="16" y="16" width="480" height="480" rx="112" fill="#2d4f6e"/><rect x="91" y="91" width="150" height="150" rx="36" fill="#3f5fe0"/><rect x="271" y="91" width="150" height="150" rx="36" fill="#f07a1e"/><rect x="91" y="271" width="150" height="150" rx="36" fill="#1f9d55"/><rect x="271" y="271" width="150" height="150" rx="36" fill="#12a58a"/></svg>
      OfficeCraft
    </a>
    <a class="back" href="./">Back to OfficeCraft</a>
  </header>
  <main>
    <div class="card">
      <h1>Contact</h1>
      <p class="lede">A question, an idea or a problem with OfficeCraft? Send it here and the reply comes to your email.</p>
      <div class="contact" data-lhd-contact data-site="officecraft"></div>
    </div>
  </main>
  <script src="https://contact.lefthanddev.com/embed.js" defer></script>
</body>
</html>
